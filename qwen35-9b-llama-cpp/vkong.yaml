type: service
app: qwen35-9b-llama-cpp
gpu: RTX 4090
num_gpus: 1
cpu_cores: 8
ram_gb: 16
disk_gb: 40
inet_down_mbps: 500
max_dph: 2.5
verified_only: true
# Official llama.cpp server image with CUDA — llama-server preinstalled.
image: ghcr.io/ggml-org/llama.cpp:server-cuda
label: qwen35-9b-llama-cpp
app_port: 8080
work_dir: .

init_cmd: |
  #!/usr/bin/env bash
  # Download GGUF model from Hugging Face.
  set -euo pipefail
  MODEL_DIR="$PWD/models"
  REPO="${REPO:-unsloth/Qwen3.5-9B-GGUF}"
  MODEL_FILE="${MODEL_FILE:-Qwen3.5-9B-Q4_K_M.gguf}"
  MODEL_PATH="$MODEL_DIR/$MODEL_FILE"
  MODEL_PART="$MODEL_PATH.part"
  MIN_MODEL_BYTES="${MIN_MODEL_BYTES:-5000000000}"
  mkdir -p "$MODEL_DIR"
  MODEL_BYTES="$(stat -c %s "$MODEL_PATH" 2>/dev/null || echo 0)"
  if [ "$MODEL_BYTES" -ge "$MIN_MODEL_BYTES" ]; then
    echo "[init] model already downloaded: $MODEL_PATH ($(ls -lh "$MODEL_PATH" | awk '{print $5}'))"
  else
    if [ -f "$MODEL_PATH" ] && [ ! -f "$MODEL_PART" ]; then
      mv "$MODEL_PATH" "$MODEL_PART"
    fi
    echo "[init] downloading $REPO/$MODEL_FILE → $MODEL_PATH"
    if ! command -v curl >/dev/null 2>&1; then
      apt-get update -qq && apt-get install -y -qq curl ca-certificates
    fi
    curl -fSL --retry 5 --retry-delay 2 --retry-all-errors --continue-at - --progress-bar \
      "https://huggingface.co/$REPO/resolve/main/$MODEL_FILE" \
      -o "$MODEL_PART"
    MODEL_BYTES="$(stat -c %s "$MODEL_PART" 2>/dev/null || echo 0)"
    if [ "$MODEL_BYTES" -lt "$MIN_MODEL_BYTES" ]; then
      echo "[init] incomplete model download: $MODEL_BYTES bytes" >&2
      exit 1
    fi
    mv "$MODEL_PART" "$MODEL_PATH"
    echo "[init] downloaded $(ls -lh "$MODEL_PATH" | awk '{print $5}')"
  fi
  echo "[init] done"

start: |
  #!/usr/bin/env bash
  # OpenAI-compatible server. Image is llama.cpp:server-cuda — llama-server is preinstalled.
  set -euo pipefail
  export LD_LIBRARY_PATH="/app:${LD_LIBRARY_PATH:-}"
  PORT="${PORT:-8080}"
  MODEL_FILE="${MODEL_FILE:-Qwen3.5-9B-Q4_K_M.gguf}"
  MODEL_PATH="$PWD/models/$MODEL_FILE"
  N_GPU_LAYERS="${N_GPU_LAYERS:-999}"
  CTX_SIZE="${CTX_SIZE:-4096}"
  echo "[start] llama-server $MODEL_FILE :$PORT ngl=$N_GPU_LAYERS ctx=$CTX_SIZE"
  exec /app/llama-server \
    -m "$MODEL_PATH" \
    --host 0.0.0.0 \
    --port "$PORT" \
    -ngl "$N_GPU_LAYERS" \
    -c "$CTX_SIZE" \
    --alias qwen3.5-9b
